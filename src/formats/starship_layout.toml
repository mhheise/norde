"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](os)\
$os\
$username\
[](bg:directory fg:os)\
$directory\
[](bg:git fg:directory)\
$git_branch\
$git_status\
$jj_bookmark\
$jj_status\
[](fg:git bg:language)\
$c\
$rust\
$golang\
$nodejs\
$bun\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:language bg:environment)\
$conda\
[](fg:environment bg:time)\
$time\
[ ](fg:time)\
$cmd_duration\
$line_break\
$character"""

palette = '{palette}'

[os]
disabled = false
style = "bg:os fg:segment_text"

[os.symbols]
Windows = " "
Ubuntu = "󰕈 "
SUSE = " "
Raspbian = "󰐿 "
Mint = "󰣭 "
Macos = "󰀵 "
Manjaro = " "
Linux = "󰌽 "
Gentoo = "󰣨 "
Fedora = "󰣛 "
Alpine = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = "󰣇 "
Artix = "󰣇 "
CachyOS = " "
CentOS = " "
Debian = "󰣚 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
Void = " "

[username]
show_always = true
style_user = "bg:os fg:segment_text"
style_root = "bg:os fg:segment_text"
format = '[$user]($style)'

[directory]
style = "bg:directory fg:segment_text"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:git"
format = '[[ $symbol $branch ](fg:segment_text bg:git)]($style)'

[git_status]
style = "bg:git"
format = '[[($all_status$ahead_behind )](fg:segment_text bg:git)]($style)'

[nodejs]
symbol = ""
style = "bg:language"
format = '[[ $symbol( $version) ](fg:segment_text bg:language)]($style)'

[bun]
symbol = ""
style = "bg:language"
format = '[[ $symbol( $version) ](fg:segment_text bg:language)]($style)'

[c]
symbol = " "
style = "bg:language"
format = '[[ $symbol( $version) ](fg:segment_text bg:language)]($style)'

[rust]
symbol = ""
style = "bg:language"
format = '[[ $symbol( $version) ](fg:segment_text bg:language)]($style)'

[golang]
symbol = ""
style = "bg:language"
format = '[[ $symbol( $version) ](fg:segment_text bg:language)]($style)'

[php]
symbol = ""
style = "bg:language"
format = '[[ $symbol( $version) ](fg:segment_text bg:language)]($style)'

[java]
symbol = " "
style = "bg:language"
format = '[[ $symbol( $version) ](fg:segment_text bg:language)]($style)'

[jj_bookmark]
symbol = ""
style = "bg:git"
format = '[[ $symbol $bookmark(@$remote)$diverged( \\(+$overflow_count others\\)) ](fg:segment_text bg:git)]($style)'

[jj_status]
style = "bg:git"
format = '[[($all )](fg:segment_text bg:git)]($style)'

[kotlin]
symbol = ""
style = "bg:language"
format = '[[ $symbol( $version) ](fg:segment_text bg:language)]($style)'

[haskell]
symbol = ""
style = "bg:language"
format = '[[ $symbol( $version) ](fg:segment_text bg:language)]($style)'

[python]
symbol = ""
style = "bg:language"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:segment_text bg:language)]($style)'

[docker_context]
symbol = ""
style = "bg:environment"
format = '[[ $symbol( $context) ](fg:segment_text bg:environment)]($style)'

[conda]
symbol = "  "
style = "fg:segment_text bg:environment"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:time"
format = '[[  $time ](fg:segment_text bg:time)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:success)'
error_symbol = '[❯](bold fg:error)'
vimcmd_symbol = '[❮](bold fg:success)'
vimcmd_replace_one_symbol = '[❮](bold fg:replace)'
vimcmd_replace_symbol = '[❮](bold fg:replace)'
vimcmd_visual_symbol = '[❮](bold fg:visual)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:time"
disabled = false
show_notifications = true
min_time_to_notify = 45000
